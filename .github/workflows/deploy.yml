name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не отменяем деплой на полпути (рекомендация Pages) — иначе публикация может
# застрять. Новые пуши ждут завершения текущего деплоя.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # API URL прокидывается из Repository Settings → Variables.
          # Если не задана — сайт соберется без подключения к API,
          # покажет баннер "API не подключен".
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BOT_USERNAME: ${{ vars.VITE_BOT_USERNAME || 'vnachale_manager_bot' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages сегодня медленно разгребает очередь публикации — ждём дольше
          # (30 мин вместо дефолтных 10), чтобы «deployment_queued» успел пройти.
          timeout: 1800000
